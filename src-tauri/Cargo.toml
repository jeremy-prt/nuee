[package]
name = "nuee"
version = "0.1.0"
description = "Desktop app to run and orchestrate coding agents"
authors = ["Jérémy Perret"]
edition = "2024"
license = "MIT"

[lib]
# Suffixe `_lib` obligatoire : sinon la lib et le binaire portent le même nom et cassent le build Windows.
name = "nuee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sys-locale = "0.3.2"
tauri = { version = "2.12.2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "sync", "time"] }
ts-rs = "12.0.1"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
